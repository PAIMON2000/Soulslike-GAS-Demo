<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>余烬档案 · 行为树实验室</title><link rel="stylesheet" href="style.css"><body><header><div class="brand">✥ <span>余烬档案<small>ASHEN ARCHIVE / AI RESEARCH</small></span></div><div class="project">黑暗之魂 Ⅲ <span>/</span> 怪物行为研究</div><span class="saved" id="saved">● 本地自动保存</span><button id="import">↥ 导入 JSON</button><button class="gold" id="export">↗ 导出档案</button></header><div class="shell"><aside><div class="eyebrow">研究工作区</div><h2>状态档案 <span id="count"></span></h2><select id="monster"></select><input id="search" placeholder="⌕ 搜索名称、原始状态…"><div class="filters"><select id="phase"><option value="">全部阶段</option><option>第一阶段</option><option>第二阶段</option></select><select id="distance"><option value="">全部距离</option><option>近距离</option><option>中距离</option><option>远距离</option></select></div><select id="statusFilter"><option value="">全部验证状态</option><option>已确认</option><option>待验证</option><option>可能是反编译误差</option></select><div id="list"></div><button class="add" id="add">＋ 新增原始状态</button><div class="aside-foot">✧ 示例研究项目<br><small>所有内容均为演示，非 DS3 实测数据</small></div></aside><main><section class="heading"><div><div class="eyebrow">BEHAVIOR TREE LAB / 01</div><h1>从混沌中，找到逻辑。</h1><p>保留原始线索，重构每一次战斗决策。</p></div><span class="version">研究草稿 <b>v1.0</b></span></section><div class="stats"><div><small>原始状态</small><b id="total">24</b></div><div><small>已确认</small><b id="confirmed">0</b></div><div><small>待验证</small><b id="pending">24</b></div><div><small>逻辑检查</small><b id="issues">—</b></div></div><nav><button class="active" data-tab="tree">♧ 行为树</button><button data-tab="table">▤ 状态表</button><button data-tab="review">◷ 验证与复盘</button><div class="spacer"></div><button id="simulate">▷ 执行推演</button><button id="layout">⊞ 整理布局</button></nav><div class="canvasbar"><span><i></i> <b id="viewtitle">洛斯里克骑士</b> / 决策图</span><span>拖拽移动节点 · 点击编辑 · 滚轮缩放</span></div><div id="workspace"><div id="tree
