const $=id=>document.getElementById(id),E=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const meanings={'顺序':'从上到下执行。成功进入下一项；失败结束本序列；运行中等待当前项。','选择':'从上到下尝试。失败才尝试下一项；成功结束本组；运行中等待当前项。','条件':'成立返回成功，不成立返回失败。','如果 / 否则':'先判断第一项；成立执行第二项，不成立执行第三项。','结果转成功':'子节点运行中就等待；子节点成功或失败，都结束此分支，下一轮重新判断。','超时':'执行期间计时；到时中止子动作并失败。','候选':'本轮可抽取的一个行动。权重为相对概率。','子树':'引用唯一的一份定义。点击＋可在原地展开。','每轮循环':'本轮完成后重新开始；运行中的动作保持执行。','加权选择':'先过滤不可用项，再按权重只抽一次。执行过程中不重抽。','持续检查目标':'运行期间监听目标失效，失效中止本轮。'};
let root=data.root,mode='main',history=[],opened=new Set(['0','0.0']),nodes=new Map(),edges=[],zoom=1,selected='0';
const view=$('view'),board=$('board');
function children(n){return n.ref?[data.subtrees[n.ref]]:n.children;}
function inspect(n,id){selected=id;for(const [key,r]of nodes)r.card.classList.toggle('selected',key===id);const p=$('details');p.replaceChildren(E('small',n.kind),E('h2',n.name));if(meanings[n.kind])p.append(E('p',meanings[n.kind]));if(n.detail)p.append(E('p',n.detail));for(const g of n.conditions||[])p.append(E('p','准入条件：'+g));if(n.weight!==undefined)p.append(E('p','相对权重 '+n.weight+'，仅在同组可用候选内比较。'));if(n.ref){const b=E('button','单独打开这棵子树');b.onclick=()=>navigate(data.subtrees[n.ref],'subtree');p.append(b);}if(id==='0'){for(const note of data.notes)p.append(E('p',note));p.append(E('a','节点规则参考 behaviac'));p.lastChild.href='https://behaviac.github.io/overview/';}if(n.parameters?.length||n.source){const d=E('details');d.append(E('summary','参数与原始来源'));for(const x of n.parameters||[])d.append(E('p',x));if(n.source)d.append(E('code',n.source));p.append(d);}}
function renderNode(n,id){const branch=E('div',undefined,'branch'),card=E('div',undefined,'card'),row=E('div',undefined,'row'),pick=E('button',undefined,'pick');const palette={'顺序':'#377eae','选择':'#8d66ac','条件':'#b08b27','动作':'#3c9179','候选':'#8d66ac','子树':'#3c9179'};card.style.setProperty('--accent',palette[n.kind]||'#617a94');const index=id==='0'?'':Number(id.split('.').at(-1))+1+' · ';pick.append(E('span',index+n.name,'title'),E('span',n.kind+(n.ref?' · 共享定义':''),'type'));pick.onclick=()=>inspect(n,id);row.append(pick);card.append(row);branch.append(card);nodes.set(id,{n,card});const kids=children(n);if(kids.length){const toggle=E('button',opened.has(id)?'−':'+','toggle');toggle.setAttribute('aria-label',(opened.has(id)?'折叠':'展开')+n.name);toggle.setAttribute('aria-expanded',String(opened.has(id)));toggle.onclick=()=>{const old=card.getBoundingClientRect().top;opened.has(id)?opened.delete(id):opened.add(id);selected=id;render();view.scrollTop+=nodes.get(id).card.getBoundingClientRect().top-old;};row.append(toggle);}if(n.weight!==undefined)card.append(E('div','抽取权重 '+n.weight,'note'));for(const g of n.conditions||[])card.append(E('div',g,'note gate'));if(n.parameters){const distance=n.parameters.find(p=>p.includes('接近目标距离'));if(distance)card.append(E('div',distance.replace('接近目标距离','本招接近间距'),'note'));}if(n.name.includes('抽一次段数'))card.append(E('div','25%两段 · 75%三段（文档记载）','note'));if(n.kind==='子树')card.append(E('div','＋ 就地展开完整步骤','note shared'));if(n.kind==='如果 / 否则')card.append(E('div','1 判断 → 2 是 / 3 否','note'));if(n.kind==='条件')card.append(E('div','是 → 继续；否 → 本分支不进入','note gate'));if(kids.length&&opened.has(id)){const list=E('div',undefined,'children');branch.append(list);kids.forEach((c,i)=>{const cid=id+'.'+i;list.append(renderNode(c,cid));edges.push([card,nodes.get(cid).card]);});}return branch;}
function wires(){const box=board.getBoundingClientRect();$('wires').replaceChildren();for(const [a,b]of edges){const x=a.getBoundingClientRect(),y=b.getBoundingClientRect(),x1=(x.right-box.left)/zoom,y1=(x.top+x.height/2-box.top)/zoom,x2=(y.left-box.left)/zoom,y2=(y.top+y.height/2-box.top)/zoom;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M '+x1+' '+y1+' C '+(x1+x2)/2+' '+y1+', '+(x1+x2)/2+' '+y2+', '+x2+' '+y2);p.setAttribute('fill','none');p.setAttribute('stroke','#91a8bc');p.setAttribute('stroke-width','1.5');$('wires').append(p);}}
function render(){nodes=new Map();edges=[];$('tree').replaceChildren(renderNode(root,'0'));const item=nodes.get(selected)||nodes.get('0');inspect(item.n,nodes.has(selected)?selected:'0');wires();}
function navigate(n,nextMode,remember=true){if(remember)history.push({root,mode});root=n;mode=nextMode;selected='0';opened=new Set(['0']);if(mode==='main')opened.add('0.0');$('scope').textContent=mode==='ordinary'?'阅读范围：基础怪物、无外部请求、非队伍配合角色。这里仅展示该情形的方向与间距规则；全部规则见「完整条件树」。':'本地设计副本，尚未接入UE。间距沿用原脚本单位。未核实事件和替代招式已标明，点击节点查看细节。';render();view.scrollTo(0,0);}
$('main').onclick=()=>navigate(data.root,'main');$('all').onclick=()=>navigate(data.subtrees.rules,'all');$('ordinary').onclick=()=>navigate({...data.subtrees.rules,name:'普通断剑怪：先看玩家方向，再看间距',children:[5,6,7,8,14,16,18].map(i=>data.subtrees.rules.children[i])},'ordinary');
